<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NeoKidsPro · Doctor Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { blue: '#4DA8FF', mint: '#B8F2E6', cream: '#FFF8E7', coral: '#FFB5A7' }
        }
      }
    }
  }
</script>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#F4F8FB}</style>
</head>
<body class="text-slate-800">
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-brand-mint mx-auto flex items-center justify-center mb-3 text-3xl">🩺</div>
      <h1 class="text-2xl font-bold">Doctor Login</h1>
      <p class="text-sm text-slate-500">NeoKidsPro EMR</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <input id="email" type="email" required placeholder="doctor@neokidspro.in" class="w-full px-4 py-3 rounded-xl border focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 outline-none"/>
      <input id="password" type="password" required placeholder="Password" class="w-full px-4 py-3 rounded-xl border focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20 outline-none"/>
      <button class="w-full py-3 rounded-xl bg-brand-blue text-white font-semibold hover:bg-blue-500">Sign In</button>
      <button type="button" onclick="forgotPassword()" class="w-full py-2 rounded-xl border text-sm">Forgot password</button>
      <p id="loginError" class="text-red-500 text-sm text-center hidden"></p>
    </form>
  </div>
</div>

<div id="dashboard" class="hidden min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-blue flex items-center justify-center text-white text-xl">🩺</div>
        <div>
          <div class="font-bold">NeoKidsPro</div>
          <div class="text-xs text-slate-500">Doctor Dashboard</div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <img id="docPhotoTop" class="hidden w-12 h-12 rounded-2xl object-cover border" alt="Doctor photo"/>
        <div class="text-right">
          <p class="text-sm font-medium" id="docName">Dr. -</p>
          <p class="text-xs text-slate-500" id="docSpec">-</p>
        </div>
        <button onclick="logout()" class="px-4 py-2 rounded-xl border hover:bg-slate-50 text-sm">Logout</button>
      </div>
    </div>
    <div class="px-6 pb-4 grid grid-cols-2 md:grid-cols-4 gap-3" id="statsBar"></div>
    <div class="px-6 border-t flex gap-1 overflow-x-auto">
      <button class="tab-btn px-4 py-3 border-b-2 border-brand-blue font-medium" data-tab="waitingTab">Waiting Room</button>
      <button class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-500" data-tab="allTab">All Appointments</button>
      <button class="tab-btn px-4 py-3 border-b-2 border-transparent text-slate-500" data-tab="settingsTab">Settings</button>
    </div>
  </header>

  <main class="p-6">
    <div id="waitingTab" class="tab-pane">
      <h2 class="text-xl font-bold mb-4">Today's Patients</h2>
      <div id="waitingList" class="space-y-3"></div>
    </div>

    <div id="allTab" class="tab-pane hidden">
      <h2 class="text-xl font-bold mb-4">All Appointments</h2>
      <div id="allList" class="space-y-3"></div>
    </div>

    <div id="settingsTab" class="tab-pane hidden">
      <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
          <h3 class="font-bold">Profile Image</h3>
          <div class="flex items-center gap-4">
            <img id="docPhotoLarge" class="w-24 h-24 rounded-3xl object-cover border bg-slate-50 hidden" alt="Doctor photo"/>
            <div class="w-24 h-24 rounded-3xl bg-brand-blue/10 flex items-center justify-center text-4xl" id="docPhotoPlaceholder">👨‍⚕️</div>
            <div class="flex-1 text-sm text-slate-500">Upload JPG, PNG, or WebP up to 2 MB.</div>
          </div>
          <form id="photoForm" class="space-y-3">
            <input id="photoInput" name="photo" type="file" accept="image/png,image/jpeg,image/webp" class="w-full px-4 py-2 rounded-xl border"/>
            <div class="flex gap-2">
              <button class="flex-1 py-2.5 rounded-xl bg-brand-blue text-white font-semibold">Upload Photo</button>
              <button type="button" onclick="removePhoto()" class="px-4 py-2.5 rounded-xl border">Remove</button>
            </div>
          </form>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm">
          <h3 class="font-bold mb-4">Availability</h3>
          <form id="availForm" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div><label class="text-sm text-slate-500">Online From</label><input name="availableFromOnline" type="time" class="w-full px-4 py-2 rounded-xl border"/></div>
              <div><label class="text-sm text-slate-500">Online To</label><input name="availableToOnline" type="time" class="w-full px-4 py-2 rounded-xl border"/></div>
              <div><label class="text-sm text-slate-500">Offline From</label><input name="availableFromOffline" type="time" class="w-full px-4 py-2 rounded-xl border"/></div>
              <div><label class="text-sm text-slate-500">Offline To</label><input name="availableToOffline" type="time" class="w-full px-4 py-2 rounded-xl border"/></div>
            </div>
            <div><label class="text-sm text-slate-500">Slot Duration (minutes)</label><input name="slotDuration" type="number" min="5" max="120" class="w-full px-4 py-2 rounded-xl border"/></div>
            <div><label class="text-sm text-slate-500">Working Days (CSV: MON,TUE,...)</label><input name="workingDays" class="w-full px-4 py-2 rounded-xl border"/></div>
            <label class="flex items-center gap-2 cursor-pointer"><input name="isAvailable" type="checkbox" class="w-4 h-4"/><span>I am accepting appointments</span></label>
            <button class="w-full py-2.5 rounded-xl bg-brand-blue text-white font-semibold">Save Availability</button>
          </form>
        </div>

        <div class="space-y-6">
          <div class="bg-white rounded-2xl p-6 shadow-sm">
            <h3 class="font-bold mb-4">Consultation Fees</h3>
            <form id="feesForm" class="space-y-3">
              <div><label class="text-sm text-slate-500">Online Consultation Fee (₹)</label><input name="onlineConsultFee" type="number" step="0.01" class="w-full px-4 py-2 rounded-xl border"/></div>
              <div><label class="text-sm text-slate-500">Physical Consultation Fee (₹)</label><input name="physicalConsultFee" type="number" step="0.01" class="w-full px-4 py-2 rounded-xl border"/></div>
              <button class="w-full py-2.5 rounded-xl bg-brand-blue text-white font-semibold">Save Fees</button>
            </form>
          </div>

          <div class="bg-white rounded-2xl p-6 shadow-sm">
            <h3 class="font-bold mb-4">Change Password</h3>
            <form id="passwordForm" class="space-y-3">
              <input name="currentPassword" type="password" required placeholder="Current password" class="w-full px-4 py-2 rounded-xl border"/>
              <input name="newPassword" type="password" required placeholder="New password" class="w-full px-4 py-2 rounded-xl border"/>
              <input name="confirmPassword" type="password" required placeholder="Confirm new password" class="w-full px-4 py-2 rounded-xl border"/>
              <button class="w-full py-2.5 rounded-xl bg-brand-blue text-white font-semibold">Change Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="patientModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl w-full max-w-5xl p-6 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">Patient Consultation</h2><button onclick="closePatientModal()" class="w-8 h-8 rounded-full hover:bg-slate-100">✕</button></div>
    <div id="patientDetail"></div>
  </div>
</div>

<div id="rescheduleModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl w-full max-w-md p-6">
    <h2 class="text-xl font-bold mb-4">Reschedule Appointment</h2>
    <form id="rescheduleForm" class="space-y-3">
      <input type="hidden" id="rsApptId"/>
      <div><label class="text-sm text-slate-500">New Date</label><input name="date" type="date" required class="w-full px-4 py-2 rounded-xl border"/></div>
      <div><label class="text-sm text-slate-500">New Time</label><input name="startTime" type="time" required class="w-full px-4 py-2 rounded-xl border"/></div>
      <div><label class="text-sm text-slate-500">Reason (sent to patient)</label><textarea name="reason" required class="w-full px-4 py-2 rounded-xl border"></textarea></div>
      <div class="flex gap-2 pt-2"><button type="button" onclick="closeRescheduleModal()" class="flex-1 py-2.5 rounded-xl border">Cancel</button><button class="flex-1 py-2.5 bg-brand-blue text-white rounded-xl font-semibold">Reschedule</button></div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
