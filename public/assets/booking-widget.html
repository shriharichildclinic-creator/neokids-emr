<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Book Appointment · NeoKidsPro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#F4F8FB}</style>
</head>
<body class="text-slate-800 min-h-screen">
<div class="max-w-3xl mx-auto p-4 sm:p-8">
  <div class="bg-white rounded-3xl shadow-lg overflow-hidden">
    <div class="bg-[#4DA8FF] text-white p-6"><h1 class="text-2xl font-bold">📅 Book Your Appointment</h1><p class="text-sm opacity-90 mt-1">Quick & easy pediatric consultations</p></div>
    <div class="px-6 py-4 border-b flex items-center justify-between text-xs"><span id="step1Label" class="font-semibold text-[#4DA8FF]">1. Doctor</span><span class="text-slate-300">›</span><span id="step2Label" class="text-slate-400">2. Details</span><span class="text-slate-300">›</span><span id="step3Label" class="text-slate-400">3. Slot</span><span class="text-slate-300">›</span><span id="step4Label" class="text-slate-400">4. Confirm</span></div>

    <div id="step1" class="p-6 space-y-3">
      <div class="flex gap-2 mb-3"><button onclick="setMode('ONLINE')" id="modeOnline" class="flex-1 px-4 py-2 rounded-xl border-2 border-[#4DA8FF] bg-[#4DA8FF]/10 text-[#4DA8FF] font-semibold">🎥 Online</button><button onclick="setMode('OFFLINE')" id="modeOffline" class="flex-1 px-4 py-2 rounded-xl border-2 border-slate-200">🏥 In-Clinic</button></div>
      <div id="doctorsList" class="space-y-2"></div>
    </div>

    <div id="step2" class="hidden p-6 space-y-3">
      <h3 class="font-bold mb-2">Patient Details</h3>
      <input id="f_name" required placeholder="Child's Full Name *" class="w-full px-4 py-3 rounded-xl border"/>
      <input id="f_parent" required placeholder="Parent/Guardian Name *" class="w-full px-4 py-3 rounded-xl border"/>
      <div class="grid grid-cols-2 gap-2"><input id="f_dob" type="date" required class="px-4 py-3 rounded-xl border" placeholder="DOB"/><select id="f_gender" required class="px-4 py-3 rounded-xl border"><option value="">Gender *</option><option>MALE</option><option>FEMALE</option><option>OTHER</option></select></div>
      <input id="f_phone" required pattern="[6-9][0-9]{9}" maxlength="10" placeholder="Phone Number (10 digits) *" class="w-full px-4 py-3 rounded-xl border"/>
      <input id="f_email" type="email" placeholder="Email (optional)" class="w-full px-4 py-3 rounded-xl border"/>
      <textarea id="f_problem" required placeholder="Primary Problem / Reason for visit *" class="w-full px-4 py-3 rounded-xl border"></textarea>
      <div class="flex gap-2"><button onclick="goTo(1)" class="flex-1 py-3 rounded-xl border">Back</button><button onclick="validateStep2()" class="flex-1 py-3 bg-[#4DA8FF] text-white rounded-xl font-semibold">Continue</button></div>
    </div>

    <div id="step3" class="hidden p-6 space-y-3">
      <h3 class="font-bold mb-2">Pick a Slot</h3>
      <input id="f_date" type="date" required class="w-full px-4 py-3 rounded-xl border"/>
      <div id="slotsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2"></div>
      <div class="flex gap-2 pt-2"><button onclick="goTo(2)" class="flex-1 py-3 rounded-xl border">Back</button><button onclick="goTo(4)" id="continueSlot" disabled class="flex-1 py-3 bg-[#4DA8FF] text-white rounded-xl font-semibold disabled:opacity-50">Continue</button></div>
    </div>

    <div id="step4" class="hidden p-6 space-y-3">
      <h3 class="font-bold mb-2">Confirm Booking</h3>
      <div id="summary" class="bg-slate-50 rounded-2xl p-4 space-y-2 text-sm"></div>
      <div class="flex gap-2 pt-2"><button onclick="goTo(3)" class="flex-1 py-3 rounded-xl border">Back</button><button onclick="submitBooking()" id="btnSubmit" class="flex-1 py-3 bg-[#4DA8FF] text-white rounded-xl font-semibold"><span id="btnSubmitText">Confirm Booking</span></button></div>
    </div>

    <div id="successScreen" class="hidden p-8 text-center"><div class="text-6xl mb-4">🎉</div><h2 class="text-2xl font-bold mb-2">Booking Recorded!</h2><p class="text-slate-500 mb-4" id="successMsg"></p><div id="successDetails" class="bg-[#B8F2E6]/30 rounded-2xl p-4 text-left text-sm"></div></div>
  </div>
</div>
<script>
const API_BASE = window.location.origin + '/api';
const state = { mode: 'ONLINE', doctor: null, date: null, slot: null };
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function formatDate(dateStr){return new Date(dateStr).toLocaleDateString('en-IN',{timeZone:'UTC',day:'2-digit',month:'short',year:'numeric'})}
function formatTime(hhmm){const [h,m]=hhmm.split(':').map(Number);const suffix=h>=12?'PM':'AM';const hour=h%12||12;return `${hour}:${String(m).padStart(2,'0')} ${suffix}`}
async function api(path, opts={}){const r=await fetch(API_BASE+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok) throw new Error(d.error||'Request failed');return d;}
function setMode(m){state.mode=m;$('#modeOnline').className=m==='ONLINE'?'flex-1 px-4 py-2 rounded-xl border-2 border-[#4DA8FF] bg-[#4DA8FF]/10 text-[#4DA8FF] font-semibold':'flex-1 px-4 py-2 rounded-xl border-2 border-slate-200';$('#modeOffline').className=m==='OFFLINE'?'flex-1 px-4 py-2 rounded-xl border-2 border-[#4DA8FF] bg-[#4DA8FF]/10 text-[#4DA8FF] font-semibold':'flex-1 px-4 py-2 rounded-xl border-2 border-slate-200';loadDoctors();}
async function loadDoctors(){const docs=await api('/public/doctors?mode='+state.mode);$('#doctorsList').innerHTML=docs.map(d=>`<div onclick="selectDoctor('${d.id}')" class="cursor-pointer p-4 rounded-2xl border hover:border-[#4DA8FF] hover:bg-[#4DA8FF]/5 flex items-center justify-between"><div class="flex items-center gap-3">${d.photoUrl?`<img src="${d.photoUrl}" class="w-12 h-12 rounded-xl object-cover border"/>`:'<div class="w-12 h-12 rounded-xl bg-[#4DA8FF]/20 flex items-center justify-center text-2xl">👨‍⚕️</div>'}<div><p class="font-semibold">Dr. ${d.name}</p><p class="text-xs text-slate-500">${d.specialization} · ${d.experience}+ yrs</p></div></div><div class="text-right"><p class="font-bold text-[#4DA8FF]">₹${state.mode==='ONLINE'?d.onlineConsultFee:d.physicalConsultFee}</p><p class="text-xs text-slate-400">${d.slotDuration} min</p></div></div>`).join('')||'<p class="text-slate-400 text-center py-6">No doctors available</p>';}
function selectDoctor(id){api('/public/doctors/'+id).then(d=>{state.doctor=d;goTo(2);});}
function goTo(step){[1,2,3,4].forEach(i=>$('#step'+i).classList.add('hidden'));$('#step'+step).classList.remove('hidden');[1,2,3,4].forEach(i=>$('#step'+i+'Label').className=i===step?'font-semibold text-[#4DA8FF]':'text-slate-400');if(step===3) initSlotPicker();if(step===4) renderSummary();}
function validateStep2(){if(!$('#f_name').value||!$('#f_parent').value||!$('#f_dob').value||!$('#f_gender').value||!$('#f_phone').value||!$('#f_problem').value) return alert('Please fill all required fields');if(!/^[6-9]\d{9}$/.test($('#f_phone').value)) return alert('Please enter a valid 10-digit Indian phone number');goTo(3);}
function initSlotPicker(){const today=new Date().toISOString().slice(0,10);if(!$('#f_date').value) $('#f_date').value=today;$('#f_date').min=today;loadSlots();$('#f_date').onchange=loadSlots;}
async function loadSlots(){state.date=$('#f_date').value;state.slot=null;$('#continueSlot').disabled=true;$('#slotsGrid').innerHTML='<p class="col-span-full text-slate-400 text-center text-sm">Loading...</p>';try{const {slots}=await api(`/public/slots?doctorId=${state.doctor.id}&date=${state.date}&type=${state.mode}`);const available=slots.filter(s=>s.available);if(!available.length){$('#slotsGrid').innerHTML='<p class="col-span-full text-slate-400 text-center text-sm py-4">No available slots on this date</p>';return;}$('#slotsGrid').innerHTML=available.map(s=>`<button onclick="pickSlot(event,'${s.startTime}')" class="py-2 rounded-xl border text-sm hover:border-[#4DA8FF] hover:bg-[#4DA8FF]/10">${formatTime(s.startTime)}</button>`).join('');}catch(e){$('#slotsGrid').innerHTML=`<p class="col-span-full text-red-500 text-center text-sm">${e.message}</p>`;}}
function pickSlot(ev,time){state.slot=time;$$('#slotsGrid button').forEach(b=>b.classList.remove('bg-[#4DA8FF]','text-white'));ev.target.classList.add('bg-[#4DA8FF]','text-white');$('#continueSlot').disabled=false;}
function renderSummary(){const fee=state.mode==='ONLINE'?state.doctor.onlineConsultFee:state.doctor.physicalConsultFee;$('#summary').innerHTML=`<div class="flex justify-between"><span class="text-slate-500">Patient:</span><span class="font-medium">${$('#f_name').value}</span></div><div class="flex justify-between"><span class="text-slate-500">Phone:</span><span>+91 ${$('#f_phone').value}</span></div><div class="flex justify-between"><span class="text-slate-500">Doctor:</span><span class="font-medium">Dr. ${state.doctor.name}</span></div><div class="flex justify-between"><span class="text-slate-500">Type:</span><span>${state.mode==='ONLINE'?'🎥 Online':'🏥 In-Clinic'}</span></div><div class="flex justify-between"><span class="text-slate-500">Date:</span><span>${formatDate(state.date)}</span></div><div class="flex justify-between"><span class="text-slate-500">Time:</span><span>${formatTime(state.slot)}</span></div><div class="border-t pt-2 mt-2 flex justify-between text-lg font-bold"><span>Fee:</span><span class="text-[#4DA8FF]">₹${fee}</span></div>${state.mode==='ONLINE'?'<p class="text-xs text-amber-700 bg-amber-50 p-2 rounded-lg mt-2">💳 Payment via Cashfree is required before booking confirmation.</p>':'<p class="text-xs text-green-700 bg-green-50 p-2 rounded-lg mt-2">💰 Pay at clinic on visit day</p>'}`;}
async function submitBooking(){$('#btnSubmit').disabled=true;$('#btnSubmitText').textContent='Booking...';try{const payload={doctorId:state.doctor.id,patientName:$('#f_name').value,phone:$('#f_phone').value,email:$('#f_email').value,parentName:$('#f_parent').value,dateOfBirth:$('#f_dob').value,gender:$('#f_gender').value,primaryProblem:$('#f_problem').value,date:state.date,startTime:state.slot,consultationType:state.mode};const res=await api('/public/book',{method:'POST',body:JSON.stringify(payload)});if(res.requiresPayment&&res.cashfree){if(typeof Cashfree!=='function') throw new Error('Cashfree SDK failed to load');const cashfree=Cashfree({mode:res.cashfree.environment||'sandbox'});const checkoutResult=await cashfree.checkout({paymentSessionId:res.cashfree.paymentSessionId,redirectTarget:'_modal'});if(checkoutResult&&checkoutResult.error) throw new Error(checkoutResult.error.message||'Payment could not be initiated');showSuccess(res.appointment,true,'Payment initiated. Booking confirms only after successful payment verification.');}else{showSuccess(res.appointment,false);}}catch(e){alert(e.message);$('#btnSubmit').disabled=false;$('#btnSubmitText').textContent='Confirm Booking';}}
function showSuccess(appt,isOnline,customMessage=''){[1,2,3,4].forEach(i=>$('#step'+i).classList.add('hidden'));$('#successScreen').classList.remove('hidden');$('#successMsg').textContent=customMessage||(isOnline?'Online payment is being verified. Final confirmation will be sent shortly.':'Your in-clinic visit is confirmed. Confirmation sent via WhatsApp.');$('#successDetails').innerHTML=`<p><strong>Appointment ID:</strong> ${appt.id.slice(0,8).toUpperCase()}</p><p><strong>Doctor:</strong> Dr. ${state.doctor.name}</p><p><strong>Date & Time:</strong> ${formatDate(state.date)} at ${formatTime(state.slot)}</p><p class="mt-2 text-slate-600">A reminder will be sent around 30 minutes before your appointment.</p>`;}
loadDoctors();
</script>
</body>
</html>
