<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Set Password · NeoKidsPro</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
<link rel="apple-touch-icon" href="/assets/favicon.svg"/>
<link rel="manifest" href="/assets/manifest.webmanifest"/>
<meta name="theme-color" content="#89BCBD"/>
<link rel="stylesheet" href="/assets/vendor/tailwind.min.css"/>
<link rel="stylesheet" href="/assets/neokids-theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Apply persisted dark theme early to avoid FOUC.
  try {
    var t = localStorage.getItem('np-theme');
    if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme','dark');
    }
  } catch(_) {}
</script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(137,188,189,.18), transparent 60%),
      radial-gradient(900px 600px at 0% 110%, rgba(254,132,164,.16), transparent 60%),
      #F7FAFA;
    color:#1E293B;
    min-height: 100vh;
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(137,188,189,.22), transparent 60%),
      radial-gradient(900px 600px at 0% 110%, rgba(254,132,164,.16), transparent 60%),
      #07090F;
    color:#E6EDF7;
  }
  .nk-card{
    background:#fff;
    border-radius:28px;
    box-shadow: 0 24px 48px -16px rgba(190,24,93,.22), 0 4px 10px rgba(190,24,93,.07);
    border:1px solid #E2EEEE;
    position:relative;
    overflow:hidden;
  }
  html[data-theme="dark"] .nk-card{
    background:#121929;
    border-color:#243049;
    box-shadow: 0 30px 60px -16px rgba(0,0,0,.7);
  }
  .nk-card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:6px;
    background: linear-gradient(90deg, #89BCBD, #A4CDCE, #F9A945);
  }
  .nk-logo{
    width:64px; height:64px; border-radius:22px;
    background: linear-gradient(135deg, #89BCBD, #6FAAAB 55%, #A4CDCE);
    display:flex; align-items:center; justify-content:center; margin:0 auto 1rem;
    color:#fff;
    box-shadow: 0 10px 26px -8px rgba(137,188,189,.5);
  }
  .nk-input{
    width:100%; padding:.75rem 1rem; border-radius:12px;
    border:1px solid #D9E6E6; background:#fff; color:#0F2E3A;
    font-size:.95rem; transition: border-color .15s, box-shadow .15s;
  }
  .nk-input:focus{
    outline:none; border-color:#89BCBD;
    box-shadow: 0 0 0 4px rgba(137,188,189,.15);
  }
  html[data-theme="dark"] .nk-input{ background:#0E1626; border-color:#243049; color:#E6EDF7; }
  html[data-theme="dark"] .nk-input::placeholder{ color:#6B7C9A; }
  .nk-btn{
    width:100%; padding:.85rem 1rem; border-radius:12px;
    background: linear-gradient(135deg, #89BCBD, #5A9495);
    color:#fff; font-weight:600; border:0; cursor:pointer;
    font-size:.95rem;
    box-shadow: 0 8px 20px -6px rgba(137,188,189,.55);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  .nk-btn:hover{ filter:brightness(1.05); transform: translateY(-1px); box-shadow: 0 12px 24px -6px rgba(137,188,189,.65); }
  .nk-label{ font-size:.82rem; font-weight:600; color:#0F2E3A; margin-bottom:.4rem; display:block; }
  html[data-theme="dark"] .nk-label{ color:#E2E8F0; }
  .nk-muted{ color:#64748B; }
  html[data-theme="dark"] .nk-muted{ color:#8FA0BD; }
  .nk-msg-ok{ color:#467878; }
  .nk-msg-err{ color:#467878; }
  html[data-theme="dark"] .nk-msg-ok{ color:#A4CDCE; }
  html[data-theme="dark"] .nk-msg-err{ color:#DCEBEB; }
  :focus-visible { outline: 2px solid #89BCBD; outline-offset: 2px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <main class="nk-card w-full max-w-md p-8" aria-labelledby="rpTitle">
    <div class="text-center mb-6">
      <div class="nk-logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <h1 id="rpTitle" class="text-2xl font-bold" style="color:inherit; font-family:'Inter',sans-serif;">Set your password</h1>
      <p class="text-sm nk-muted mt-1">Welcome to NeoKidsPro — use this page for invited accounts and password resets.</p>
    </div>

    <form id="resetForm" class="space-y-4" novalidate>
      <div>
        <label for="password" class="nk-label">New password</label>
        <input id="password" name="newPassword" type="password" minlength="8" required autocomplete="new-password"
               class="nk-input" placeholder="Minimum 8 characters"
               aria-required="true" aria-describedby="pwHelp"/>
        <p id="pwHelp" class="sr-only">Password must be at least 8 characters long.</p>
      </div>
      <div>
        <label for="confirmPassword" class="nk-label">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"
               class="nk-input" placeholder="Re-enter password"
               aria-required="true"/>
      </div>
      <button type="submit" class="nk-btn">Save password</button>
      <p id="message" class="text-sm text-center" role="status" aria-live="polite"></p>
    </form>
  </main>

<script src="/assets/np-ui.js?v=1.1.0"></script>
<script>
'use strict';
const API = '/api';
const params = new URLSearchParams(window.location.search);
const token  = params.get('token');

function setMessage(message, isError=false) {
  const el = document.getElementById('message');
  el.textContent = message;
  el.className = `text-sm text-center ${isError ? 'nk-msg-err' : 'nk-msg-ok'}`;
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password        = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (!token) return setMessage('Missing reset token in URL.', true);
  if (password !== confirmPassword) return setMessage('Passwords do not match.', true);

  try {
    const res = await fetch(API + '/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password, confirmPassword })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Password reset failed');
    setMessage('Password updated successfully. You can now sign in.');
  } catch (err) {
    setMessage(err.message, true);
  }
});
</script>
</body>
</html>
