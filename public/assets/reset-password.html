<!DOCTYPE html>
<!--
  reset-password.html — fixes #30 (accessibility), #31 (local Tailwind),
                        #32 (no inline handlers — was already clean).
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Set Password · NeoKidsPro</title>
<!-- Issue #31 — local Tailwind, not CDN -->
<link rel="stylesheet" href="/assets/vendor/tailwind.min.css"/>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #F4F8FB; }
  :focus-visible { outline: 2px solid #4DA8FF; outline-offset: 2px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">
  <main class="bg-white shadow-xl rounded-3xl w-full max-w-md p-8" aria-labelledby="rpTitle">
    <div class="text-center mb-6">
      <div class="w-16 h-16 rounded-2xl bg-[#4DA8FF] text-white flex items-center justify-center mx-auto text-3xl mb-3" aria-hidden="true">🔐</div>
      <h1 id="rpTitle" class="text-2xl font-bold">Set your password</h1>
      <p class="text-sm text-slate-500">Use this page for invited accounts and password resets.</p>
    </div>

    <form id="resetForm" class="space-y-4" novalidate>
      <div>
        <label for="password" class="block text-sm font-medium mb-1">New password</label>
        <input id="password" name="newPassword" type="password" minlength="8" required autocomplete="new-password"
               class="w-full px-4 py-3 rounded-xl border" placeholder="Minimum 8 characters"
               aria-required="true" aria-describedby="pwHelp"/>
        <p id="pwHelp" class="sr-only">Password must be at least 8 characters long.</p>
      </div>
      <div>
        <label for="confirmPassword" class="block text-sm font-medium mb-1">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"
               class="w-full px-4 py-3 rounded-xl border" placeholder="Re-enter password"
               aria-required="true"/>
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-[#4DA8FF] text-white font-semibold">Save password</button>
      <p id="message" class="text-sm text-center" role="status" aria-live="polite"></p>
    </form>
  </main>

<script>
'use strict';
const API = '/api';
const params = new URLSearchParams(window.location.search);
const token  = params.get('token');

function setMessage(message, isError=false) {
  const el = document.getElementById('message');
  el.textContent = message;
  el.className = `text-sm text-center ${isError ? 'text-red-500' : 'text-green-600'}`;
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password        = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (!token) return setMessage('Missing reset token in URL.', true);
  if (password !== confirmPassword) return setMessage('Passwords do not match.', true);

  try {
    const res = await fetch(API + '/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password, confirmPassword })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Password reset failed');
    setMessage('Password updated successfully. You can now sign in.');
  } catch (err) {
    setMessage(err.message, true);
  }
});
</script>
</body>
</html>
